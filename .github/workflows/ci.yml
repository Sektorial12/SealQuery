name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          target: wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          rustup component add rustfmt --toolchain 1.99.1
          rustfmt --version
          cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build approved workload
        run: cargo build -p sealquery-workload --bin sealquery-approved --target wasm32-wasip2 --release --features wasm

      - name: Build contract wasm
        run: cargo build -p sealquery --target wasm32-unknown-unknown --release

      - name: Secret scan
        run: ./scripts/check_secrets.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Compile
        run: python -m compileall backend/app

      - name: Tests
        env:
          CONTRACT_ACCOUNT: contract.testnet
          AGENT_ACCOUNT: agent.testnet
          DATABASE_URL: sqlite:////tmp/sealquery-ci.db
          REDIS_URL: ""
          INDEXER_ON_STARTUP: "0"
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  reproducible:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          target: wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown

      - name: Install cargo-near
        run: |
          curl -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh

      - name: Reproducible contract build
        working-directory: contracts/sealquery
        run: cargo near build reproducible-wasm
