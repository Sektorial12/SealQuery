[package]
name = "sealquery-workload"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sealquery_workload"
path = "src/lib.rs"

[[bin]]
name = "sealquery-probe"
path = "src/main.rs"

[[bin]]
name = "sealquery-approved"
path = "src/bin/approved.rs"
required-features = ["wasm"]

[features]
default = []
wasm = ["dep:outlayer"]

[dependencies]
csv = "1.3"
outlayer = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
