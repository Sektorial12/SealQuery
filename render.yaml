# Render blueprint for the hosted public testnet mirror.
# Canonical deployment remains compose.yaml (open-source/self-host).
#
# Required dashboard setup:
# - Neon Postgres -> DATABASE_URL
# - Upstash Redis -> REDIS_URL
# - Render secret file near-access-key.json on sealquery-worker only ->
#   /etc/secrets/near-access-key.json
# - Set API_URL on sealquery-web to https://<sealquery-api>.onrender.com
services:
  - type: web
    name: sealquery-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    disk:
      name: sealquery-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: CONTRACT_ACCOUNT
        sync: false
      - key: AGENT_ACCOUNT
        sync: false
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC
        value: https://rpc.testnet.fastnear.com
      - key: OUTLAYER_API
        value: https://testnet-api.outlayer.ai
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SEALQUERY_API_KEY
        generateValue: true
      - key: SEALQUERY_STATE_TTL_SECONDS
        value: "15"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: PROOF_DIR
        value: data/proofs

  - type: worker
    name: sealquery-indexer
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.indexer
    envVars:
      - key: CONTRACT_ACCOUNT
        fromService:
          type: web
          name: sealquery-api
          envVarKey: CONTRACT_ACCOUNT
      - key: AGENT_ACCOUNT
        fromService:
          type: web
          name: sealquery-api
          envVarKey: AGENT_ACCOUNT
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC
        value: https://rpc.testnet.fastnear.com
      - key: OUTLAYER_API
        value: https://testnet-api.outlayer.ai
      - key: DATABASE_URL
        fromService:
          type: web
          name: sealquery-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: sealquery-api
          envVarKey: REDIS_URL
      - key: INDEXER_INTERVAL_SECONDS
        value: "15"
      - key: EVENT_START_BLOCK
        value: "277135250"
      - key: EVENT_BLOCKS_PER_SYNC
        value: "100"
      - key: EVENT_MAX_LAG_BLOCKS
        value: "10000"
      - key: EVENT_REINDEX
        value: "0"
      - key: PROOF_DIR
        value: data/proofs

  - type: worker
    name: sealquery-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    envVars:
      - key: CONTRACT_ACCOUNT
        fromService:
          type: web
          name: sealquery-api
          envVarKey: CONTRACT_ACCOUNT
      - key: AGENT_ACCOUNT
        fromService:
          type: web
          name: sealquery-api
          envVarKey: AGENT_ACCOUNT
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC
        value: https://rpc.testnet.fastnear.com
      - key: OUTLAYER_API
        value: https://testnet-api.outlayer.ai
      - key: NEAR_ACCESS_KEY_FILE
        value: /etc/secrets/near-access-key.json
      - key: DATABASE_URL
        fromService:
          type: web
          name: sealquery-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: sealquery-api
          envVarKey: REDIS_URL
      - key: JOB_TIMEOUT_SECONDS
        value: "300"
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: PROOF_DIR
        value: data/proofs

  - type: web
    name: sealquery-web
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      mkdir -p .next/standalone/.next/static &&
      cp -R .next/static/. .next/standalone/.next/static/
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        sync: false
