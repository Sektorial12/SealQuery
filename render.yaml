# Render blueprint for the hosted public testnet mirror.
# Canonical deployment remains compose.yaml (open-source/self-host).
#
# Required dashboard setup:
# - Neon Postgres -> DATABASE_URL
# - Upstash Redis -> REDIS_URL
# - Render secret file near-access-key.json -> /etc/secrets/near-access-key.json
# - Set API_URL on sealquery-web to https://<sealquery-api>.onrender.com
services:
  - type: web
    name: sealquery-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: sealquery-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: CONTRACT_ACCOUNT
        sync: false
      - key: AGENT_ACCOUNT
        sync: false
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC
        value: https://rpc.testnet.fastnear.com
      - key: OUTLAYER_API
        value: https://testnet-api.outlayer.ai
      - key: NEAR_ACCESS_KEY_FILE
        value: /etc/secrets/near-access-key.json
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SEALQUERY_API_KEY
        generateValue: true
      - key: SEALQUERY_STATE_TTL_SECONDS
        value: "5"
      - key: PROOF_DIR
        value: data/proofs
      - key: LEGACY_TX_FILE
        value: data/query_tx.json

  - type: worker
    name: sealquery-indexer
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.indexer
    envVars:
      - key: CONTRACT_ACCOUNT
        sync: false
      - key: AGENT_ACCOUNT
        sync: false
      - key: NEAR_NETWORK
        value: testnet
      - key: NEAR_RPC
        value: https://rpc.testnet.fastnear.com
      - key: OUTLAYER_API
        value: https://testnet-api.outlayer.ai
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INDEXER_INTERVAL_SECONDS
        value: "15"
      - key: PROOF_DIR
        value: data/proofs
      - key: LEGACY_TX_FILE
        value: data/query_tx.json

  - type: web
    name: sealquery-web
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        sync: false
